  <h1>DR RouteFit · Logo 草图 v3（一笔画成 R）</h1>

<script>
  document.querySelectorAll("canvas[data-src]").forEach(function (cv) {
    var svg = document.getElementById(cv.dataset.src).querySelector("svg");
    if (!svg) return;
    var img = new Image();
    img.onload = function () {
      var ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 16, 16);
      ctx.drawImage(img, 0, 0, 16, 16);
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.outerHTML);
  });
</script>
