<style>
  :root { --ink: #0B2545; --muted: #5B6B7F; --line: #E3E8EF; --bg: #F6F8FB; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
         font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--muted); font-size: 13px; margin: 0 0 24px; max-width: 760px; line-height: 1.6; }
  h2 { font-size: 14px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px;
          display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 110px; }
  .card.black-bg { background: #111; border-color: #111; }
  .label { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
  figure { margin: 0; }
  .pixel { display: flex; gap: 12px; align-items: center; }
  .pixel canvas { width: 128px; height: 128px; image-rendering: pixelated; border: 1px solid var(--line); background: #fff; }
  .src { display: none; }
</style>

  <h1>DR RouteFit · Logo 草图 v2（一笔画成货箱，读作 D）</h1>
  <p class="note">路线从青绿起点沿底边进入，绕过右侧圆腹，经顶边折下成左侧竖笔，整体读作 DR 的 “D”；竖笔底部留口作装货口，橙色货物装在 D 的腹内。16px 另有按像素网格重画的专用版。草图字体为系统字体，定稿前须换授权字体并转路径。</p>

  <h2>16px 像素级对比（先按 16×16 栅格化，再放大 8 倍）</h2>

    <figure><div class="card pixel"><canvas data-src="src-main" width="16" height="16"></canvas></div><div class="label">主图形直接缩到 16px</div></figure>
    <figure><div class="card pixel"><canvas data-src="src-fav" width="16" height="16"></canvas></div><div class="label">16px 专用版 routefit-favicon.svg</div></figure>

  </div>

  <div class="src" id="src-fav-mono"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="DR RouteFit">

<script>
  document.querySelectorAll("canvas[data-src]").forEach(function (cv) {
    var svg = document.getElementById(cv.dataset.src).querySelector("svg");
    if (!svg) return;
    var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.outerHTML);
    var img = new Image();
    img.onload = function () {
      var ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 16, 16);
      ctx.drawImage(img, 0, 0, 16, 16);
    };
    img.src = url;
  });
</script>
