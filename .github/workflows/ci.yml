name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# NOT_RUN: prototype/browser-*.js require an interactive Playwright MCP session.
# NOT_RUN: real-device GPS/offline behavior, real maps/banks/KESS need separate approval and evidence.
# RF-PM-001 / RF-PM-007: migration SQL issues located in 051, 057 and 061.
# Keep failures visible; do not skip tests or mark continue-on-error.
# Seven integration files run concurrently; each applies 63 migrations in one transaction.
# The cluster-wide role routefit_api is created once, under an advisory lock, by db/local-fixture.mjs.
# Human local observation: PostgreSQL max_connections=40 caused all seven to fail
# with "out of shared memory" (53200); max_connections=100 initialized normally.
# postgres:16 defaults to 100. This observation has not been verified on Actions.
# If CI hits 53200, consider --test-concurrency=1 (not silently enabled here).
jobs:
  # CMP-1417: pure file check, no npm ci / DB. Full history so the base-ref diff is never silently empty.
  migration-numbering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Migration numbering gate (unit tests)
        run: node --test scripts/check-migration-numbering.test.mjs
      - name: Migration numbering gate (pull_request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-numbering.mjs --base-ref "origin/${{ github.base_ref }}"
      - name: Migration numbering gate (push)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="origin/develop"; fi
          node scripts/check-migration-numbering.mjs --base-ref "$base"

  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prototype tests (TAP)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          node --test --test-reporter=tap prototype/*.test.mjs 2>&1 | tee test-results/prototype.tap
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: prototype-tap
          path: test-results/*.tap
          if-no-files-found: error

  service-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/routefit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/routefit/package-lock.json
      - run: npm ci
      - name: Service unit tests (TAP)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          NODE_OPTIONS=--test-reporter=tap npm test 2>&1 | tee test-results/service-unit.tap
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: service-unit-tap
          path: services/routefit/test-results/*.tap
          if-no-files-found: error

  service-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/routefit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routefit_ci
          POSTGRES_PASSWORD: routefit_ci_disposable
          POSTGRES_DB: routefit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routefit_ci -d routefit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROUTEFIT_TEST_DATABASE_URL: postgresql://routefit_ci:routefit_ci_disposable@127.0.0.1:5432/routefit_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/routefit/package-lock.json
      - run: npm ci
      - name: Install PostgreSQL client for trial backup/restore integration
        run: |
          # Diagnostic: which PostgreSQL majors the runner image ships before we install anything.
          if [ -d /usr/lib/postgresql ]; then
            echo "runner image PostgreSQL majors:" && ls -1 /usr/lib/postgresql
          else
            echo "runner image has no /usr/lib/postgresql"
          fi
          # The runner's default apt sources no longer carry postgresql-client-16,
          # so add the official PGDG repository, then install the exact major version.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          # Client major version must equal the service container (postgres:16):
          # a newer pg_dump emits settings (e.g. transaction_timeout, PG17+) that a 16 server rejects.
          sudo apt-get install -y -qq postgresql-client-16
          pg_bin="/usr/lib/postgresql/16/bin"
          for tool in pg_dump pg_restore psql; do
            if [ ! -x "$pg_bin/$tool" ]; then
              echo "$pg_bin/$tool is missing; PostgreSQL 16 client was not installed" >&2
              exit 1
            fi
          done
          "$pg_bin/pg_dump" --version | grep -q ' 16\.' || { echo "pg_dump is not major version 16" >&2; exit 1; }
          echo "$pg_bin" >> "$GITHUB_PATH"
          echo "ROUTEFIT_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      # Every integration test calls localFixture(), which creates its own random
      # synthetic database, applies all migrations, uses an RLS runtime role and cleans up.
      # No separate migration against the administrative template database is needed.
      - name: Migrate fixtures and run service integration tests (TAP)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          NODE_OPTIONS=--test-reporter=tap npm run test:integration 2>&1 | tee test-results/service-integration.tap
      - name: Fee API HTTP integration (TAP)
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap ../../prototype/fee-api.integration.mjs 2>&1 | tee test-results/fee-api-integration.tap
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: service-integration-tap
          path: services/routefit/test-results/*.tap
          if-no-files-found: error

  trial-tooling-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/routefit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/routefit/package-lock.json
      - run: npm ci
      - run: node --test tests/trial-tooling.test.mjs

  trial-tooling-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/routefit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/routefit/package-lock.json
      - run: npm ci
      - run: node --test tests/trial-tooling.test.mjs

  driver-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Shared client package checks
        run: npm run lint --workspace @routefit/shared && npm test --workspace @routefit/shared
      - name: Driver app lint
        run: npm run lint --workspace @routefit/driver-app
      - name: Driver app type check
        run: npm run typecheck --workspace @routefit/driver-app
      - name: Driver app offline queue unit tests
        run: npm test --workspace @routefit/driver-app
      - name: Driver app Android export check
        run: npm run build:check --workspace @routefit/driver-app

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Install Khmer font for browser checks
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          khmer_font="$(fc-list | grep -i khmer | head -n 1)"
          test -n "$khmer_font"
          printf '%s\n' "$khmer_font"
      - run: npx playwright install --with-deps chromium
      - name: Website build, link, browser and accessibility checks
        run: npm test
        env:
          EVIDENCE_DIR: test-results/playwright
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: website-playwright-failure
          path: website/test-results/playwright/**
          if-no-files-found: warn

  customer-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Customer app lint
        run: npm run lint --workspace @routefit/customer-app
      - name: Customer app type check
        run: npm run typecheck --workspace @routefit/customer-app
      - name: Customer app unit tests
        run: npm test --workspace @routefit/customer-app
      - name: Customer app web export
        run: npm run build:web --workspace @routefit/customer-app

  admin-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Admin app lint
        run: npm run lint --workspace @routefit/admin-app
      - name: Admin app type check
        run: npm run typecheck --workspace @routefit/admin-app
      - name: Admin app unit tests
        run: npm test --workspace @routefit/admin-app
      - name: Admin app web export
        run: npm run build:web --workspace @routefit/admin-app
