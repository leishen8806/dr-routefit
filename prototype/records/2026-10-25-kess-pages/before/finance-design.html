<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DR RouteFit · 财务跨端设计图 v0.1</title><link rel="icon" href="../brand/logo/routefit-favicon.svg"><link rel="stylesheet" href="./app.css"><style>body{padding:32px;max-width:1520px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:32px}header img{width:220px}h1{font-size:28px;margin:20px 0 12px}.design-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.design-grid figure{background:var(--rf-surface);border:1px solid var(--rf-line);border-radius:8px;padding:20px;margin:0}.design-grid img{display:block;width:100%;height:400px;object-fit:contain;object-position:top;border:1px solid var(--rf-line);margin-top:16px}.design-grid figcaption{line-height:1.8}.design-grid a{color:var(--rf-navy)}.design-grid h2{font-size:20px}@media(max-width:760px){body{padding:20px 14px}.design-grid{grid-template-columns:1fr}}</style></head><body><header><img src="../brand/logo/routefit-horizontal.svg" alt="DR RouteFit"><a class="btn primary" href="./finance.html">打开可交互 Demo</a></header><h1>订单与财务，同一条追溯链</h1><p>v0.1 · 2026-10-24 · 来自实际可交互页面的浏览器截图，全部为合成案例。点击图片查看原尺寸。</p><p>财务按待办工作；司机、用户、商户、合作方、仓库各看授权范围。已审核、已执行、已确认和已核销分别呈现。</p><div class="design-grid">
<figure><figcaption><h2>财务今日待办</h2>六组菜单、明确下一负责人和处理入口。</figcaption><a href="./designs/finance-v01/finance.png"><img src="./designs/finance-v01/finance.png" alt="财务工作台待办及汇总设计图"></a></figure>
<figure><figcaption><h2>三人审核</h2>同版本的经办、复核、审批及完整时间线。</figcaption><a href="./designs/finance-v01/approval.png"><img src="./designs/finance-v01/approval.png" alt="核销单的经办复核审批记录"></a></figure>
<figure><figcaption><h2>订单资金追溯</h2>原单、分项金额、核销来源、现金交接批次。</figcaption><a href="./designs/finance-v01/trace.png"><img src="./designs/finance-v01/trace.png" alt="订单资金来源和去向追溯"></a></figure>
<figure><figcaption><h2>司机端账款</h2>待交现金与本人收入分开，手机卡片展开。</figcaption><a href="./designs/finance-v01/driver.png"><img src="./designs/finance-v01/driver.png" alt="司机手机订单现金与收入设计"></a></figure>
<figure><figcaption><h2>用户端账单</h2>配送、保险、代收分项，付款与退款进度可查。</figcaption><a href="./designs/finance-v01/customer.png"><img src="./designs/finance-v01/customer.png" alt="用户手机费用账单设计"></a></figure>
<figure><figcaption><h2>商户对账</h2>应代收、已收及待返还不同口径。</figcaption><a href="./designs/finance-v01/merchant.png"><img src="./designs/finance-v01/merchant.png" alt="商户COD待返还与对账明细"></a></figure>
<figure><figcaption><h2>仓库费用依据</h2>货品件数与服务费用，不显示银行和其他主体成本。</figcaption><a href="./designs/finance-v01/warehouse.png"><img src="./designs/finance-v01/warehouse.png" alt="仓库作业和费用依据设计"></a></figure>
<figure><figcaption><h2>管理报表</h2>原额、批准调整、核定额、核销与未结。</figcaption><a href="./designs/finance-v01/manager.png"><img src="./designs/finance-v01/manager.png" alt="管理者的业务账目与资金保管报表"></a></figure>
<figure><figcaption><h2>交款差额</h2>实际210、申报220，差额10保留待查及补交审核。</figcaption><a href="./designs/finance-v01/cash-difference.png"><img src="./designs/finance-v01/cash-difference.png" alt="司机现金交款差额处理"></a></figure>
<figure><figcaption><h2>付款结果未知</h2>占用不释放，不显示已付或允许直接重发。</figcaption><a href="./designs/finance-v01/payment-unknown.png"><img src="./designs/finance-v01/payment-unknown.png" alt="未知付款结果和独立核对状态"></a></figure>
<figure><figcaption><h2>合作方运费结算</h2>仅显示本主体运单、核定成本及待付款。</figcaption><a href="./designs/finance-v01/carrier.png"><img src="./designs/finance-v01/carrier.png" alt="合作承运方订单应付与结算设计"></a></figure>
<figure><figcaption><h2>KESS 客户支付</h2>配送与保险合付分账；模拟查询，成功后仍待核销和渠道结算。</figcaption><a href="./designs/finance-v01/kess-customer.png"><img src="./designs/finance-v01/kess-customer.png" alt="KESS用户支付与渠道收款状态"></a></figure><figure><figcaption><h2>KESS 待结算报表</h2>渠道已收款与公司银行可付款分开。</figcaption><a href="./designs/finance-v01/kess-report.png"><img src="./designs/finance-v01/kess-report.png" alt="KESS待结算与公司保管余额"></a></figure></div><p>这些图用于产品评审，不代表真实资金、生产授权、完整会计报表或真实用户可用性验收。</p></body></html>
